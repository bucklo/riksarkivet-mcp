[project]
name = "riksarkivet-mcp"
version = "0.1.0"
description = "MCP server for Riksarkivet (Swedish National Archives) open data: search, place lookup and reading digitised church books via IIIF"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "genealogy", "riksarkivet", "sweden", "iiif", "archives"]
dependencies = [
    "httpx>=0.25.0",
    "mcp>=2.0",
]

[project.scripts]
riksarkivet-mcp = "riksarkivet_mcp.server:main"

[project.urls]
Repository = "https://github.com/bucklo/riksarkivet-mcp"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riksarkivet_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real Riksarkivet APIs"]
